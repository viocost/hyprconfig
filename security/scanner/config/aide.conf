# aide.conf — host integrity policy for the security-scanner wrapper
#
# Self-contained: uses its own database and paths under /var/lib/security-scanner
# so it never clashes with a stock /etc/aide.conf. Invoked explicitly by the
# wrapper via:  aide --config=/etc/security-scanner/aide.conf
#
# Baseline (trusted):      /var/lib/security-scanner/aide.db.gz
# Freshly written db:      /var/lib/security-scanner/aide.db.new.gz
#
# Rationale for what is watched: the malware you hit installed a systemd
# service plus a few binaries that ran at startup. Anything that runs at
# startup must be referenced from one of: a systemd unit, a cron entry, an
# XDG autostart entry, a shell rc file, or must live in a PATH bin dir. All of
# those are watched below, so a dropped startup binary cannot hide.

# --------------------------------------------------------------------------
# Database + report
# --------------------------------------------------------------------------
database_in=file:/var/lib/security-scanner/aide.db.gz
database_out=file:/var/lib/security-scanner/aide.db.new.gz
gzip_dbout=yes

# Emit the report to stdout; the wrapper captures and post-processes it.
report_url=stdout

# --------------------------------------------------------------------------
# Attribute groups (rules)
#   p=perms i=inode n=links u=uid g=gid s=size b=blocks m=mtime c=ctime
#   Deliberately NO atime (a) — access times change constantly and are noise.
# --------------------------------------------------------------------------
Binlib    = p+i+n+u+g+s+b+m+c+sha256
ConfFiles = p+i+n+u+g+s+m+c+sha256
Dirs      = p+i+n+u+g
Loose     = p+u+g+sha256

# ==========================================================================
# System binaries and libraries (dropped/replaced executables in PATH)
# ==========================================================================
/usr/bin        Binlib
/usr/lib        Binlib
/usr/local/bin  Binlib
/usr/local/sbin Binlib
/opt            Binlib
/boot           Binlib

# ==========================================================================
# systemd units (service persistence) — system + this user's user units
# ==========================================================================
/etc/systemd/system         ConfFiles
/usr/lib/systemd/system      ConfFiles
/etc/systemd/user            ConfFiles
/home/kostia/.config/systemd/user ConfFiles

# ==========================================================================
# cron (scheduled persistence)
# ==========================================================================
/etc/crontab       ConfFiles
/etc/cron.d        ConfFiles
/etc/cron.hourly   ConfFiles
/etc/cron.daily    ConfFiles
/etc/cron.weekly   ConfFiles
/etc/cron.monthly  ConfFiles
/var/spool/cron    ConfFiles

# ==========================================================================
# Login / shell / loader persistence vectors
# ==========================================================================
/etc/profile          ConfFiles
/etc/profile.d        ConfFiles
/etc/bash.bashrc      ConfFiles
/etc/zsh              ConfFiles
/etc/environment      ConfFiles
=/etc/ld.so.preload   ConfFiles
/etc/ld.so.conf       ConfFiles
/etc/ld.so.conf.d     ConfFiles
/etc/pam.d            ConfFiles
/etc/xdg/autostart    ConfFiles

# ==========================================================================
# Accounts / privilege escalation
# ==========================================================================
=/etc/passwd    ConfFiles
=/etc/shadow    ConfFiles
=/etc/group     ConfFiles
=/etc/gshadow   ConfFiles
=/etc/sudoers   ConfFiles
/etc/sudoers.d  ConfFiles
=/etc/hosts     ConfFiles

# ==========================================================================
# This user's autostart / PATH bins / shell rc / compositor exec
#   AIDE selects by path, not by the +x bit, so we watch the specific places
#   startup code lives rather than hashing the entire (noisy) home tree.
# ==========================================================================
/home/kostia/.local/bin      Binlib
/home/kostia/bin             Binlib
/home/kostia/.config/autostart ConfFiles
/home/kostia/.config/hypr    ConfFiles
=/home/kostia/.bashrc        ConfFiles
=/home/kostia/.bash_profile  ConfFiles
=/home/kostia/.zshrc         ConfFiles
=/home/kostia/.zshenv        ConfFiles
=/home/kostia/.zprofile      ConfFiles
=/home/kostia/.profile       ConfFiles
=/home/kostia/.ssh/authorized_keys ConfFiles
=/home/kostia/.ssh/config    ConfFiles

# ==========================================================================
# Exclusions — churny paths that would otherwise generate noise
# ==========================================================================
!/usr/lib/modules
!/var/spool/cron/atjobs
!/home/kostia/.config/hypr/.*\.bak$
