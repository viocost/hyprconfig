# scanner.conf — configuration for the security-scan wrapper
#
# Installed to /etc/security-scanner/scanner.conf (root-owned, 600). Sourced by
# /usr/local/bin/security-scan. Because root sources this file, it MUST remain
# root-owned and not writable by anyone else — the wrapper refuses to source it
# otherwise (sudo-style safety check).

# --- Checks -----------------------------------------------------------------
# Toggle the two detection engines independently.
RUN_AIDE=1            # AIDE file-integrity check (systemd/cron/bins/etc.)
RUN_PACMAN=1          # pacman -Qkk vendor-checksum verification

# Path to the AIDE policy used for --check / --init.
AIDE_CONFIG="/etc/security-scanner/aide.conf"

# --- Desktop notifications --------------------------------------------------
NOTIFY_ENABLED=1      # send a swaync notification on findings
NOTIFY_USER="kostia"  # GUI user whose session receives the notification
NOTIFY_ON_CLEAN=0     # 1 = also notify when a scan is clean

# What the notification's Copy button puts on the clipboard: path | content
NOTIFY_COPY_MODE="path"

# Command used by the notification's "Open report" action ({} = report path).
NOTIFY_OPEN_CMD="kitty -e nvim {}"

# --- Reports ----------------------------------------------------------------
REPORT_DIR="/var/log/security-scanner/reports"
REPORT_KEEP=30        # prune to the newest N reports (0 = keep all)
