# Hyprland Configuration
# Based on i3wm config from arconfig

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,highres,auto,1

# Execute at launch
exec-once = kanshi                        # Dynamic monitor layout; must run before per-monitor bars
exec-once = ~/.config/waybar/launch.sh
exec-once = hyprland-autoname-workspaces --config ~/.config/hypr/hyprland-autoname-workspaces.toml
exec-once = swaync
exec-once = hypridle
exec-once = hyprpaper
exec-once = nm-applet
exec-once = blueman-tray
exec-once = hyprpolkitagent

# Source sub-configs
source = ~/.config/hypr/hyprland/env.conf
source = ~/.config/hypr/hyprland/input.conf
source = ~/.config/hypr/hyprland/general.conf
source = ~/.config/hypr/hyprland/decoration.conf
source = ~/.config/hypr/hyprland/animations.conf
source = ~/.config/hypr/hyprland/keybindings.conf
# source = ~/.config/hypr/hyprland/windowrules.conf
source = ~/.config/hypr/hyprland/workspaces.conf

# Monitor layout is managed dynamically by kanshi (see exec-once above and
# ~/.config/kanshi/config). The old static monitors.conf is left in place as a
# reference/backup but is intentionally no longer sourced.
# source = ~/.config/hypr/monitors.conf


layerrule {
  name = swaync-cc
  match:namespace = swaync-control-center
  blur = true
  ignore_alpha = 0.01
}

layerrule {
  name = swaync-notif
  match:namespace = swaync-notification-window
  blur = true
  ignore_alpha = 0.01
}

source = ~/.config/hypr/hyprcaffeine-keybinds.conf
