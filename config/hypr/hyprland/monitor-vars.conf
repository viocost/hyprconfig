# monitor-vars.conf — SINGLE SOURCE OF TRUTH for monitor connector names.
#
# Edit connector names here when hardware changes (use 'hyprctl monitors' to find them).
# Everything else is derived automatically:
#
#   Hyprland (workspaces.conf, input.conf) — reads $monitorN variables natively
#   hyprpaper.conf                         — generated at login by apply-monitor-vars.sh
#   waybar/launch.sh                       — sources ~/.config/hypr/monitor-env.sh (generated)
#
# DO NOT hardcode connector names in any other config file.

# Monitor Definitions
$monitor1 = DP-1          # Left monitor   - Dell 4K (3840x2160)
$monitor2 = DP-6          # Middle monitor - Dell 1080p (1920x1080)
$monitor3 = eDP-1         # Internal laptop monitor (1920x1200)

# Workspace ranges per monitor
# Monitor 1 (left):     workspaces 1-8
# Monitor 2 (middle):   workspaces 9-16
# Monitor 3 (internal): workspaces 17-20
